name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Publishable anahtar istemci paketine zaten gömülür; gizli değildir. Erişim RLS ile korunur.
  NEXT_PUBLIC_SUPABASE_URL: https://lbocidoprcqiuxtqhoye.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_iwaXltsu1QuuBjHXAo0c-g_bQLrbqnc
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  check:
    name: Typecheck · Lint · DB/RLS testleri · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OSM çıkarım testleri (Python)
        run: pip install -q osmium==4.* pytest && python -m pytest -q scripts/osm
      - name: Şema ↔ tip senkronu
        run: npm run db:types && git diff --exit-code src/lib/database.types.ts
      - run: npm run build
      - name: Performans bütçesi (First Load JS)
        run: npm run perf:budget
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E (gerçek Supabase)
    needs: check
    runs-on: ubuntu-latest
    # Aynı test hesaplarını (Supabase) kullanan E2E işleri asla aynı anda koşmaz
    concurrency:
      group: e2e-shared-supabase
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      E2E_ALICE_EMAIL: e2e-alice@rovia.test
      E2E_BOB_EMAIL: e2e-bob@rovia.test
      E2E_ALICE_PASSWORD: ${{ secrets.E2E_ALICE_PASSWORD }}
      E2E_BOB_PASSWORD: ${{ secrets.E2E_BOB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee e2e.log
      - name: Sunucu loglarında hata olmamalı
        run: |
          if grep -E "\[WebServer\].*(Error:|\[rovia\])" e2e.log; then
            echo "::error::E2E sırasında sunucu hata logladı"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens
          path: test-results/screens
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
