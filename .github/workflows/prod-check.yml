name: Yayın kontrolü

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Kontrol edilecek adres"
        default: "https://rovia-seven.vercel.app"
  deployment_status:

jobs:
  prod-check:
    # Elle tetiklenince veya Vercel üretim dağıtımı başarıyla bitince
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    # Aynı test hesaplarını (Supabase) kullanan E2E işleri asla aynı anda koşmaz
    concurrency:
      group: e2e-shared-supabase
      cancel-in-progress: false
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ inputs.url || 'https://rovia-seven.vercel.app' }}
      NEXT_PUBLIC_SUPABASE_URL: https://lbocidoprcqiuxtqhoye.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_iwaXltsu1QuuBjHXAo0c-g_bQLrbqnc
      E2E_ALICE_EMAIL: e2e-alice@rovia.test
      E2E_ALICE_PASSWORD: ${{ secrets.E2E_ALICE_PASSWORD }}
      E2E_BOB_EMAIL: e2e-bob@rovia.test
      E2E_BOB_PASSWORD: ${{ secrets.E2E_BOB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/prod-diagnose.spec.ts e2e/map.spec.ts e2e/favorites.spec.ts e2e/journal.spec.ts e2e/routing.spec.ts e2e/mobile-layout.spec.ts e2e/travelogue.spec.ts e2e/share.spec.ts --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-screens
          path: test-results/
          retention-days: 7
